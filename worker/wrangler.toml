name = "dualuse-classifier"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# Create the namespace once with:  npx wrangler kv namespace create BUDGET_KV
# then paste the returned id below.
kv_namespaces = [
  { binding = "BUDGET_KV", id = "1a3d1d82986f4cf78d21eeb907c01fd5" }
]

[vars]
ALLOWED_ORIGINS = "https://rikiosso.github.io"
ANNEX_URL = "https://rikiosso.github.io/exports-watch/data/annex.json"
DAILY_BUDGET_USD = "1.00"
MONTHLY_BUDGET_USD = "14"
IP_DAILY_CONVERSATIONS = "2"
MAX_TURNS = "10"
LOOP_MODEL = "claude-sonnet-5"
VERDICT_MODEL = "claude-sonnet-5"

# Secrets (never in this file):
#   npx wrangler secret put ANTHROPIC_API_KEY   (a dedicated key with a monthly spend limit)
#   npx wrangler secret put IP_SALT             (any random string)
