name: deploy-worker

on:
  push:
    branches: [main]
    paths: ["worker/**"]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      # Deploys only when the Cloudflare token secret is configured. The check
      # lives in the shell: the `secrets` context is not available in a step
      # `if`, and that expression made every run fail at parse time.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set: tests and typecheck passed, deploy skipped (deploy from a workstation with wrangler)."
            exit 0
          fi
          npx wrangler deploy
